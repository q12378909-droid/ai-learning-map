<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="t d"><title id="t">數幾件，還是等多久？</title><desc id="d">固定來電速率每小時2通，半小時計數參數為1，零通機率約0.3679；等待時間平均30分鐘，超過15分鐘機率約0.6065。</desc><rect width="960" height="800" rx="24" fill="#f1f6f1"/><g fill="#244338" font-family="Microsoft JhengHei, sans-serif"><text x="48" y="62" font-size="32" font-weight="bold">同一個客服情境，先問你要算什麼</text><text x="48" y="105" font-size="21">模型假設：齊次 Poisson 過程 · 固定速率 r = 2 通／小時</text><rect x="40" y="145" width="430" height="410" rx="18" fill="white"/><rect x="490" y="145" width="430" height="410" rx="18" fill="white"/><text x="65" y="190" font-size="24" font-weight="bold">① 半小時來幾通？</text><text x="65" y="232" font-size="20">N 是件數：0、1、2、3…</text><text x="65" y="283" font-size="27" fill="#3c7564">Poisson 分佈</text><text x="65" y="325" font-size="20">區間 t = 0.5 小時</text><text x="65" y="364" font-size="23">λ = r × t = 2 × 0.5 = 1</text><path d="M70 390H440" stroke="#c7d8cd"/><text x="65" y="434" font-size="20">P(N = 0) = e⁻¹</text><text x="65" y="480" font-size="32" font-weight="bold">約 36.79%</text><text x="65" y="523" font-size="18">λ 是這段區間的平均件數</text><text x="515" y="190" font-size="24" font-weight="bold">② 下一通等多久？</text><text x="515" y="232" font-size="20">T 是時間：非負連續量</text><text x="515" y="283" font-size="27" fill="#956a3e">指數分佈</text><text x="515" y="325" font-size="20">平均時間 = 1 / r = 0.5 小時</text><text x="515" y="364" font-size="23">15 分鐘 = 0.25 小時</text><path d="M520 390H890" stroke="#c7d8cd"/><text x="515" y="434" font-size="20">P(T &gt; 0.25) = e⁻⁰·⁵</text><text x="515" y="480" font-size="32" font-weight="bold">約 60.65%</text><text x="515" y="523" font-size="18">這裡用速率 r，不是尺度 1/r</text><rect x="40" y="585" width="880" height="170" rx="18" fill="#dfeade"/><text x="65" y="628" font-size="23" font-weight="bold">換你教：為什麼兩個答案不同？</text><text x="65" y="669" font-size="21">36.79%：半小時內零通，也就是等超過 30 分鐘。</text><text x="65" y="706" font-size="21">60.65%：只要求等超過 15 分鐘，條件比較容易達到。</text><text x="48" y="785" font-size="17">原創示例 · 非真實客服數據 · 有尖峰、相依或來電潮時需重新檢查模型</text></g></svg>