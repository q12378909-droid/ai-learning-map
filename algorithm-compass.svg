<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc"><title id="title">常見演算法：先選工作，再選工具</title><desc id="desc">預測、分群、降維、關聯四類任務及候選方法，下方比較三種集成合作方式。</desc><rect width="960" height="790" rx="24" fill="#f3f7f5"/><g font-family="system-ui,sans-serif" fill="#203c3d"><text x="40" y="45" font-size="14" fill="#537b70">L23202 · 演算法選擇地圖</text><text x="40" y="88" font-size="30" font-weight="700">先說要完成的工作，再挑工具。</text><text x="40" y="121" font-size="17" fill="#637777">比喻幫你理解原理；驗證才幫你決定選擇。</text>
<rect x="35" y="150" width="435" height="185" rx="14" fill="white" stroke="#c9dcd4"/><rect x="490" y="150" width="435" height="185" rx="14" fill="white" stroke="#ccd7e3"/><rect x="35" y="355" width="435" height="170" rx="14" fill="white" stroke="#ddd3e5"/><rect x="490" y="355" width="435" height="170" rx="14" fill="white" stroke="#e4d9c4"/>
<g font-size="23" font-weight="700"><text x="55" y="188">01 預測答案 · 分類／迴歸</text><text x="510" y="188">02 整理族群 · 分群</text><text x="55" y="394">03 壓縮表示 · 降維</text><text x="510" y="394">04 找出共現 · 關聯規則</text></g>
<g font-size="17"><text x="55" y="223">估價單：線性／邏輯斯迴歸</text><text x="55" y="252">問鄰居：kNN　留走道：SVM</text><text x="55" y="281">是非題：樹　合併線索：樸素貝氏</text><text x="510" y="223">搬桌子：K-means　找密度：DBSCAN</text><text x="510" y="252">家族樹：階層分群</text><text x="510" y="281">機率歸屬：GMM</text><text x="55" y="430">轉鏡頭：PCA　非負拼積木：NMF</text><text x="55" y="460">看近鄰：t-SNE（探索視覺化）</text><text x="510" y="430">購物籃：Apriori／FP-growth</text><text x="510" y="460">支持度、信賴度、提升度各看分母</text></g>
<g font-size="14" fill="#637777"><text x="55" y="311">需要可靠標籤；檢查泛化與錯誤成本。</text><text x="510" y="311">群號不是已知類別；檢查結構與穩定。</text><text x="55" y="495">保留變異不保證保留預測訊號。</text><text x="510" y="495">一起出現，不代表互為原因。</text></g>
<text x="40" y="570" font-size="21" font-weight="700">多人怎麼合作？三種集成方式</text><rect x="40" y="591" width="275" height="115" rx="12" fill="#e0eee7"/><rect x="343" y="591" width="275" height="115" rx="12" fill="#e6edf5"/><rect x="646" y="591" width="275" height="115" rx="12" fill="#eee8f3"/>
<g text-anchor="middle" font-size="21" font-weight="600"><text x="177" y="626">Bagging</text><text x="480" y="626">Boosting</text><text x="783" y="626">Stacking</text></g><g text-anchor="middle" font-size="16"><text x="177" y="657">不同抽樣，各自學習</text><text x="177" y="682">再彙整預測</text><text x="480" y="657">依序加入模型</text><text x="480" y="682">逐步改善目前目標</text><text x="783" y="657">使用適當折外預測</text><text x="783" y="682">學習如何整合</text></g><text x="40" y="752" font-size="16" fill="#637777">共同底線：合理切分 → 訓練內前處理 → 驗證選擇 → 固定方案後測試</text></g></svg>
