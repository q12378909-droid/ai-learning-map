<svg xmlns="http://www.w3.org/2000/svg" width="800" height="940" viewBox="0 0 800 940" role="img" aria-labelledby="title desc">
<title id="title">資料表如何變成模型分數</title><desc id="desc">3乘2的資料矩陣乘2乘1的權重，再加偏置1，得到3乘1的分數11、11、5。</desc>
<rect width="800" height="940" rx="24" fill="#f1f5f9"/>
<g font-family="Microsoft JhengHei, sans-serif" text-anchor="middle">
<text x="400" y="62" font-size="34" font-weight="700" fill="#0f172a">三位顧客，怎麼算成三個分數？</text>
<text x="400" y="104" font-size="24" fill="#475569">每一列，做一次相同的加權計算</text>
<rect x="60" y="140" width="680" height="260" rx="20" fill="#fff" stroke="#cbd5e1"/>
<text x="400" y="180" font-size="26" font-weight="700" fill="#075985">X：3 位顧客 × 2 個特徵</text>
<g font-size="25" fill="#334155"><text x="190" y="227">顧客</text><text x="400" y="227">購買次數</text><text x="610" y="227">瀏覽次數</text>
<text x="190" y="277">A</text><text x="400" y="277">2</text><text x="610" y="277">1</text>
<text x="190" y="327">B</text><text x="400" y="327">1</text><text x="610" y="327">3</text>
<text x="190" y="377">C</text><text x="400" y="377">0</text><text x="610" y="377">2</text></g>
<path d="M400 409v30m-12-12 12 12 12-12" stroke="#64748b" stroke-width="4" fill="none"/>
<rect x="60" y="452" width="680" height="98" rx="18" fill="#e0f2fe"/>
<text x="400" y="492" font-size="27" font-weight="700" fill="#075985">購買權重 4 ／ 瀏覽權重 2</text>
<text x="400" y="530" font-size="23" fill="#075985">w 為 2×1；每位顧客另加偏置 b＝1</text>
<path d="M400 560v30m-12-12 12 12 12-12" stroke="#64748b" stroke-width="4" fill="none"/>
<rect x="60" y="605" width="680" height="185" rx="18" fill="#ccfbf1"/>
<g font-size="30" fill="#115e59"><text x="400" y="653">A：2×4 ＋ 1×2 ＋ 1 ＝ 11</text><text x="400" y="707">B：1×4 ＋ 3×2 ＋ 1 ＝ 11</text><text x="400" y="761">C：0×4 ＋ 2×2 ＋ 1 ＝ 5</text></g>
<text x="400" y="839" font-size="27" font-weight="700" fill="#0f172a">(3×2) × (2×1) → 3×1</text>
<text x="400" y="889" font-size="21" fill="#475569">原創示意｜分數不是機率；欄位順序不能交換</text>
</g></svg>
