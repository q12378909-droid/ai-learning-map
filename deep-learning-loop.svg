<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">深度學習：計算、追查、更新</title><desc id="desc">用單參數梯度下降例子區分前向、反向與更新，並比較三種架構。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53786b"/></marker></defs><rect width="1000" height="820" rx="24" fill="#f3f6ef"/><g font-family="Microsoft JhengHei, sans-serif" fill="#183f32"><text x="48" y="55" font-size="17" letter-spacing="2">L23203 · FEYNMAN LEARNING</text><text x="48" y="104" font-size="34" font-weight="bold">算答案 → 找梯度 → 改參數</text><text x="48" y="141" font-size="19">先能說清三種工作，再談網路有多深。</text></g><g stroke="#53786b" stroke-width="3" marker-end="url(#arrow)"><path d="M320 253H349"/><path d="M650 253H679"/><path d="M835 351V390H170V355" fill="none"/></g><g fill="white" stroke="#ccdbce"><rect x="40" y="180" width="280" height="170" rx="16"/><rect x="360" y="180" width="290" height="170" rx="16"/><rect x="690" y="180" width="270" height="170" rx="16"/></g><g font-family="Microsoft JhengHei, sans-serif" fill="#183f32"><g font-size="25" font-weight="bold"><text x="62" y="220">① 前向計算</text><text x="382" y="220">② 反向傳播</text><text x="712" y="220">③ 優化器更新</text></g><g font-size="20"><text x="62" y="260">x=2，w=1 → ŷ=2</text><text x="62" y="296">目標 y=3，損失=0.5</text><text x="382" y="260">梯度=(ŷ−y)x=−2</text><text x="382" y="296">知道方向，尚未更新</text><text x="712" y="260">w新=1−0.1×(−2)</text><text x="712" y="296">=1.2 → 新損失0.18</text><text x="275" y="424">用更新後的參數，再做下一次前向計算</text></g><text x="48" y="470" font-size="17">數值假設：L=½(ŷ−y)²；單樣本、單參數；普通梯度下降，學習率0.1。</text><text x="48" y="525" font-size="27" font-weight="bold">資料長什麼樣，影響架構怎麼選</text></g><g fill="#e0eadf"><rect x="40" y="551" width="280" height="159" rx="16"/><rect x="360" y="551" width="290" height="159" rx="16"/><rect x="690" y="551" width="270" height="159" rx="16"/></g><g font-family="Microsoft JhengHei, sans-serif" fill="#183f32"><g font-size="24" font-weight="bold"><text x="62" y="591">CNN · 局部檢查尺</text><text x="382" y="591">RNN · 隨時間寫筆記</text><text x="712" y="591">Transformer</text></g><g font-size="20"><text x="62" y="630">局部運算、共享權重</text><text x="62" y="669">常見：影像與空間結構</text><text x="382" y="630">狀態遞迴、時間共享</text><text x="382" y="669">常見：有順序的資料</text><text x="712" y="630">注意力、位置與遮罩</text><text x="712" y="669">文字、影像等序列表示</text></g><text x="48" y="757" font-size="20" font-weight="bold">教回去：哪一步算梯度？哪一步真的改權重？</text><text x="48" y="792" font-size="16">原創概念圖；架構用途並非互斥。這次損失下降，不代表所有步長與每一步都保證下降。</text></g></svg>