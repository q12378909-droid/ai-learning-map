<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">等待時間的三種摘要</title><desc id="desc">原始資料1、2、3、4、5、6、7、20分鐘；平均6，中位數4.5。箱形圖Q1為2.5、Q3為6.5，鬚1與7，上界12.5，20另標。</desc><rect width="960" height="760" rx="24" fill="#f3f6ed"/><g font-family="Microsoft JhengHei, sans-serif" fill="#253e33"><text x="48" y="58" font-size="30" font-weight="bold">一筆等很久，如何改變摘要？</text><text x="48" y="94" font-size="19">8 筆等待時間 · 1、2、3、4、5、6、7、20 分鐘</text><rect x="40" y="120" width="880" height="160" rx="18" fill="white"/><text x="65" y="154" font-size="20" font-weight="bold">① 原始資料：點的位置依分鐘數繪製</text><path d="M110 224H870" stroke="#80958a" stroke-width="2"/><circle cx="146" cy="199" r="9" fill="#4a7661"/><text x="146" y="251" text-anchor="middle" font-size="18">1</text><circle cx="182" cy="199" r="9" fill="#4a7661"/><text x="182" y="251" text-anchor="middle" font-size="18">2</text><circle cx="218" cy="199" r="9" fill="#4a7661"/><text x="218" y="251" text-anchor="middle" font-size="18">3</text><circle cx="254" cy="199" r="9" fill="#4a7661"/><text x="254" y="251" text-anchor="middle" font-size="18">4</text><circle cx="290" cy="199" r="9" fill="#4a7661"/><text x="290" y="251" text-anchor="middle" font-size="18">5</text><circle cx="326" cy="199" r="9" fill="#4a7661"/><text x="326" y="251" text-anchor="middle" font-size="18">6</text><circle cx="362" cy="199" r="9" fill="#4a7661"/><text x="362" y="251" text-anchor="middle" font-size="18">7</text><circle cx="830" cy="199" r="9" fill="#be7043"/><text x="830" y="251" text-anchor="middle" font-size="18">20</text><rect x="40" y="302" width="420" height="104" rx="18" fill="#dce9d7"/><text x="65" y="340" font-size="20">算術平均：48 ÷ 8</text><text x="65" y="382" font-size="30" font-weight="bold">6 分鐘</text><rect x="480" y="302" width="440" height="104" rx="18" fill="#e9e4d8"/><text x="505" y="340" font-size="20">中位數：(4 + 5) ÷ 2</text><text x="505" y="382" font-size="30" font-weight="bold">4.5 分鐘</text><rect x="40" y="430" width="880" height="230" rx="18" fill="white"/><text x="65" y="466" font-size="20" font-weight="bold">② 箱形圖：箱子與鬚，都沿用上方刻度</text><path d="M146 535H362 M146 519V551 M362 519V551" stroke="#416854" stroke-width="3"/><rect x="200" y="507" width="144" height="56" fill="#c2d8b5" stroke="#416854" stroke-width="2"/><path d="M272 507V563" stroke="#253e33" stroke-width="4"/><path d="M560 495V574" stroke="#be7043" stroke-width="2" stroke-dasharray="6 5"/><circle cx="830" cy="535" r="9" fill="#be7043"/><text x="146" y="592" text-anchor="middle" font-size="17">鬚 1</text><text x="200" y="493" text-anchor="middle" font-size="17">Q1 2.5</text><text x="272" y="592" text-anchor="middle" font-size="17">中位 4.5</text><text x="344" y="493" text-anchor="middle" font-size="17">Q3 6.5</text><text x="375" y="592" text-anchor="middle" font-size="17">鬚 7</text><text x="560" y="592" text-anchor="middle" font-size="17">上界 12.5</text><text x="830" y="592" text-anchor="middle" font-size="17">20 另標</text><text x="65" y="633" font-size="18">IQR = 6.5 − 2.5 = 4　｜　上界 = 6.5 + 1.5 × 4 = 12.5</text><text x="48" y="700" font-size="20" font-weight="bold">界線是判別門檻；鬚端點是界線內最遠的實際觀測值。</text><text x="48" y="735" font-size="17">原創示例 · 上下各半取中位數 · 下界 −3.5（圖外） · 離群標記不代表錯誤</text></g></svg>