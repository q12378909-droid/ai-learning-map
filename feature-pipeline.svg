<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
<title id="title">先切分，再學規則：訓練與驗收走不同支線</title>
<desc id="desc">先依時間或群組切分。訓練部分學出補值、編碼及縮放規則，驗證與測試部分只套用固定規則，不重新擬合或重採樣。圖下以平均100與標準差20示範140轉成2。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#53714b" stroke-width="1.5"/></marker></defs>
<rect width="720" height="650" rx="20" fill="#eff4e9"/>
<g font-family="sans-serif" fill="#254432">
<text x="32" y="48" font-size="26" font-weight="bold">先切分，再學規則</text>
<text x="32" y="79" font-size="17">資料邊界先確定，不能讓驗收資料回頭制定尺規。</text>
<rect x="130" y="103" width="460" height="67" rx="12" fill="white" stroke="#c6d2bf"/>
<text x="360" y="132" text-anchor="middle" font-size="20" font-weight="bold">定義快照與截止時間 → 依任務切分</text>
<text x="360" y="157" text-anchor="middle" font-size="16">先排除未來才可取得的欄位</text>
<g fill="none" stroke="#53714b" stroke-width="2" marker-end="url(#arr)"><path d="M360 175V192H187V213"/><path d="M360 192H533V213"/></g>
<rect x="32" y="220" width="310" height="187" rx="14" fill="#dce8d3"/>
<rect x="378" y="220" width="310" height="187" rx="14" fill="white" stroke="#c6d2bf"/>
<g text-anchor="middle">
<text x="187" y="252" font-size="23" font-weight="bold">訓練部分</text>
<text x="187" y="286" font-size="20">fit：學出處理規則</text>
<text x="187" y="316" font-size="18">補值、編碼、縮放、選欄位</text>
<text x="187" y="348" font-size="18">需要重採樣？只在這一邊</text>
<text x="187" y="381" font-size="18">轉換後訓練模型</text>
<text x="533" y="252" font-size="23" font-weight="bold">驗證／測試部分</text>
<text x="533" y="286" font-size="20">transform：用固定規則</text>
<text x="533" y="316" font-size="18">不重新估平均、建立字典</text>
<text x="533" y="348" font-size="18">不重採樣，保留評估情境</text>
<text x="533" y="381" font-size="18">預測，再核對真實結果</text>
</g>
<path d="M187 412V438H533V413" fill="none" stroke="#53714b" stroke-width="2" marker-end="url(#arr)"/>
<text x="360" y="465" text-anchor="middle" font-size="17">保存訓練學到的規則 → 原樣交給驗收支線</text>
<rect x="32" y="490" width="656" height="102" rx="12" fill="#fff9e9" stroke="#d6c79e"/>
<text x="52" y="520" font-size="20" font-weight="bold">手算：訓練規則 μ＝100、σ＝20</text>
<text x="52" y="551" font-size="19">新資料 140 → (140 − 100) ÷ 20＝2</text>
<text x="52" y="578" font-size="17">新的一批資料進來，也不自行換一把尺。</text>
<text x="360" y="625" text-anchor="middle" font-size="16">原創示意：交叉驗證每折都要重新建立自己的訓練規則。</text>
</g></svg>
