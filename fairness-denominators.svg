<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="t d"><title id="t">公平指標：先看分母</title><desc id="d">兩組準確率相同，但選取率、召回率、誤報率不同。</desc><rect width="1000" height="800" rx="24" fill="#f3f6ef"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="45" y="50" font-size="17">L23402 · FEYNMAN LEARNING</text><text x="45" y="100" font-size="34" font-weight="bold">平均都80%，誰仍被漏掉？</text><text x="45" y="139" font-size="20">正例＝需要優先協助；預測正例＝送入優先隊列。</text></g><rect x="40" y="175" width="440" height="132" rx="16" fill="white" stroke="#cbd8c9"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="60" y="211" font-size="25" font-weight="bold">A組 · 100件</text><text x="60" y="250" font-size="21">TP 40 ｜ FN 10 ｜ FP 10 ｜ TN 40</text><text x="60" y="283" font-size="19">準確率＝(TP＋TN)／100＝80%</text></g><rect x="520" y="175" width="440" height="132" rx="16" fill="white" stroke="#cbd8c9"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="540" y="211" font-size="25" font-weight="bold">B組 · 100件</text><text x="540" y="250" font-size="21">TP 10 ｜ FN 10 ｜ FP 10 ｜ TN 70</text><text x="540" y="283" font-size="19">準確率＝(TP＋TN)／100＝80%</text></g><rect x="40" y="345" width="280" height="230" rx="16" fill="#e0eadf"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="58" y="385" font-size="25" font-weight="bold">選取率</text><text x="58" y="424" font-size="19">分母：所有案件</text><text x="58" y="468" font-size="22">A：50／100＝50%</text><text x="58" y="507" font-size="22">B：20／100＝20%</text><text x="58" y="549" font-size="19">差距30個百分點</text></g><rect x="360" y="345" width="280" height="230" rx="16" fill="#e0eadf"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="378" y="385" font-size="25" font-weight="bold">TPR · 召回率</text><text x="378" y="424" font-size="19">分母：真正需要者</text><text x="378" y="468" font-size="22">A：40／50＝80%</text><text x="378" y="507" font-size="22">B：10／20＝50%</text><text x="378" y="549" font-size="19">差距30個百分點</text></g><rect x="680" y="345" width="280" height="230" rx="16" fill="#e0eadf"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="698" y="385" font-size="25" font-weight="bold">FPR · 誤報率</text><text x="698" y="424" font-size="19">分母：真正不需要者</text><text x="698" y="468" font-size="22">A：10／50＝20%</text><text x="698" y="507" font-size="22">B：10／80＝12.5%</text><text x="698" y="549" font-size="19">差距7.5個百分點</text></g><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="45" y="627" font-size="23" font-weight="bold">人口統計均等 → 看選取率；機會均等 → 看TPR</text><text x="45" y="666" font-size="23" font-weight="bold">Equalized odds → 同時看TPR與FPR</text><text x="45" y="722" font-size="20">教回去：兩組都漏掉10件，為什麼漏判率不一樣？</text><text x="45" y="769" font-size="16">原創示意。差異需連同樣本、標籤與實際影響調查；單一數字不等於完全公平。</text></g></svg>