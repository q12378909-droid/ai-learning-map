<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
<title id="title">多模態客服：先辨認證據，再做結論</title><desc id="desc">文字說杯子碎了，照片只顯示外箱。兩者對應同一案件，但照片不能證明杯子的狀態，應請補商品照片。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#53714b" stroke-width="1.5"/></marker></defs>
<rect width="720" height="600" rx="20" fill="#eff4e9"/>
<g font-family="sans-serif" fill="#294432">
<text x="36" y="48" font-size="24" font-weight="bold">兩種線索，不等於兩份證明</text>
<rect x="30" y="78" width="320" height="172" rx="15" fill="white" stroke="#bbcdb1"/>
<rect x="370" y="78" width="320" height="172" rx="15" fill="white" stroke="#bbcdb1"/>
<text x="52" y="110" font-size="18" font-weight="bold">文字｜顧客陳述</text>
<text x="52" y="155" font-size="24">「玻璃杯碎了」</text>
<text x="52" y="215" font-size="17">知道顧客在說什麼</text>
<text x="392" y="110" font-size="18" font-weight="bold">照片｜可見範圍</text>
<rect x="485" y="128" width="90" height="58" rx="3" fill="#cfb58b" stroke="#876a40"/>
<path d="M530 128V186" stroke="#f0dab4" stroke-width="12"/>
<text x="392" y="215" font-size="17">只看得到外箱，杯子不可見</text>
<path d="M190 250V275H530V250M360 275V304" fill="none" stroke="#53714b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="105" y="312" width="510" height="66" rx="12" fill="#dce9d2"/>
<text x="360" y="340" text-anchor="middle" font-size="19" font-weight="bold">先對齊：是否同一案件、同一商品？</text>
<text x="360" y="365" text-anchor="middle" font-size="16">來源配對正確，才有共同判讀的基礎</text>
<path d="M360 378V410" stroke="#53714b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="420" width="620" height="130" rx="14" fill="#fff7e7" stroke="#d1b47e"/>
<text x="76" y="454" font-size="21" font-weight="bold">證據不足：不能確認杯子是否破損</text>
<text x="76" y="489" font-size="18">下一步：請補拍杯子與損壞位置，再依流程處理。</text>
<text x="76" y="521" font-size="16">外箱完整 ≠ 杯子完整　｜　顧客陳述 ≠ 照片已證實</text>
<text x="360" y="580" text-anchor="middle" font-size="15">原創教學示意・非實際顧客資料或模型結果</text>
</g></svg>
