<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">資料保護：沿著生命週期檢查</title><desc id="desc">目的、蒐集、訓練、分享、刪除五站，以及三種保護技術的不同用途。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53786b"/></marker></defs><rect width="1000" height="820" rx="24" fill="#f3f6ef"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="44" y="52" font-size="17" letter-spacing="2">L23401 · FEYNMAN LEARNING</text><text x="44" y="100" font-size="34" font-weight="bold">有鑰匙，也要有使用資料的理由</text><text x="44" y="140" font-size="20">每一站都問：必要嗎？誰能看？怎麼證明有做到？</text></g><g fill="white" stroke="#ccdccc"><rect x="35" y="190" width="175" height="170" rx="14"/><g fill="#183f32" stroke="none" font-family="Microsoft JhengHei,sans-serif"><text x="50" y="230" font-size="24" font-weight="bold">① 目的</text><text x="50" y="278" font-size="18">預測配送延遲</text><text x="50" y="315" font-size="18">先列必要欄位</text></g><path d="M212 260h15" stroke="#53786b" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="190" width="175" height="170" rx="14"/><g fill="#183f32" stroke="none" font-family="Microsoft JhengHei,sans-serif"><text x="245" y="230" font-size="24" font-weight="bold">② 蒐集</text><text x="245" y="278" font-size="18">確認來源與依據</text><text x="245" y="315" font-size="18">分離聯絡資訊</text></g><path d="M407 260h15" stroke="#53786b" stroke-width="2" marker-end="url(#a)"/><rect x="425" y="190" width="175" height="170" rx="14"/><g fill="#183f32" stroke="none" font-family="Microsoft JhengHei,sans-serif"><text x="440" y="230" font-size="24" font-weight="bold">③ 訓練</text><text x="440" y="278" font-size="18">管理權限與版本</text><text x="440" y="315" font-size="18">別漏掉日誌</text></g><path d="M602 260h15" stroke="#53786b" stroke-width="2" marker-end="url(#a)"/><rect x="620" y="190" width="175" height="170" rx="14"/><g fill="#183f32" stroke="none" font-family="Microsoft JhengHei,sans-serif"><text x="635" y="230" font-size="24" font-weight="bold">④ 分享</text><text x="635" y="278" font-size="18">限制接收與用途</text><text x="635" y="315" font-size="18">查核供應商</text></g><path d="M797 260h15" stroke="#53786b" stroke-width="2" marker-end="url(#a)"/><rect x="815" y="190" width="175" height="170" rx="14"/><g fill="#183f32" stroke="none" font-family="Microsoft JhengHei,sans-serif"><text x="830" y="230" font-size="24" font-weight="bold">⑤ 刪除</text><text x="830" y="278" font-size="18">定位副本與備份</text><text x="830" y="315" font-size="18">驗證處理結果</text></g></g><path d="M122 364V393H900V364" fill="none" stroke="#53786b" stroke-width="2"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="145" y="432" font-size="20">旁支也要追蹤：快取 · 實驗檔 · 報表 · 備份 · 外部服務</text><text x="44" y="491" font-size="27" font-weight="bold">三種工具，回答三種不同的問題</text></g><rect x="35" y="519" width="280" height="187" rx="16" fill="#e0eadf"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="55" y="558" font-size="25" font-weight="bold">加密</text><text x="55" y="599" font-size="21">如何限制讀取？</text><text x="55" y="638" font-size="19">保護資料與金鑰</text><text x="55" y="676" font-size="19">不替代用途審查</text></g><rect x="360" y="519" width="280" height="187" rx="16" fill="#e0eadf"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="380" y="558" font-size="25" font-weight="bold">聯邦學習</text><text x="380" y="599" font-size="21">資料在哪裡訓練？</text><text x="380" y="638" font-size="19">各端訓練、整合更新</text><text x="380" y="676" font-size="19">更新仍可能洩漏</text></g><rect x="685" y="519" width="280" height="187" rx="16" fill="#e0eadf"/><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="705" y="558" font-size="25" font-weight="bold">差分隱私</text><text x="705" y="599" font-size="21">單一人影響多大？</text><text x="705" y="638" font-size="19">明確機制與隱私參數</text><text x="705" y="676" font-size="19">任意加噪不算保證</text></g><g font-family="Microsoft JhengHei,sans-serif" fill="#183f32"><text x="44" y="755" font-size="22" font-weight="bold">教回去：刪掉姓名之後，還有哪些地方可能找到這個人？</text><text x="44" y="792" font-size="16">原創概念圖。技術需配合責任、驗證與適用規範；不是一張完整的法遵清單。</text></g></svg>